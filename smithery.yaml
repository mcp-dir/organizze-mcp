# Smithery configuration for Organizze
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_organizze

name: organizze-mcp
displayName: "Organizze"
description: >
  Suas finanças do Organizze por linguagem natural: saldos consolidados, visão do mês, busca de lançamentos, faturas de cartão, contas fixas, orçamentos, relatórios por categoria e tag, projeção de fluxo de caixa e status do Open Finance. Conecte sua conta em um clique, sem chave nem token. Na tela do Organizze, desmarque "Permitir alterações" se quiser acesso somente leitura.

version: 0.1.1
license: MIT
homepage: https://github.com/mcp-dir/organizze-mcp
repository: https://github.com/mcp-dir/organizze-mcp

tags:
  - organizze
  - brazil
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_organizze

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_organizze/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
